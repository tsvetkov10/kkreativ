    <!-- Preload Critical LCP Animation with Per-Load Cache-Busting for Mobile Replays -->
    <script>
      (function() {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
        } catch (e) {}
        window.__KK_ANIM_TIME__ = Date.now();
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.type = 'image/webp';
        l.href = '/Comp 9_1.webp?v=' + window.__KK_ANIM_TIME__;
        l.fetchPriority = 'high';
        document.head.appendChild(l);
      })();
    </script>
    <noscript>
      <link rel="preload" as="image" type="image/webp" href="/Comp 9_1.webp" fetchpriority="high" />
    </noscript>

    <!-- Preload Custom Brand Fonts -->
    <link rel="preload" as="font" type="font/otf" href="/fonts/Akira-Expanded.otf" crossorigin />
    <link rel="preload" as="font" type="font/otf" href="/fonts/Creating-Minimalist.otf" crossorigin />

    <!-- Google Fonts Preconnect & Async Non-Blocking Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      rel="preload" 
      as="style" 
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" 
    />
    <link 
      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" 
      media="print" 
      onload="this.media='all'" 
    />
    <noscript>
      <link 
        rel="stylesheet" 
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
